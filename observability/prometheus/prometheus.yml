global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: autospec

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: autospec-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080
        labels:
          component: control-plane

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
