openapi: 3.0.3
info:
  title: AutoSpec Backend API
  version: 5.0.0
  description: Current AutoSpec API for dynamic workflow orchestration, artifacts, approvals, delivery, and observability.
servers:
- url: /
security:
- SessionToken: []
paths:
  /api/contracts/openapi:
    get:
      summary: Fetch the packaged OpenAPI contract for tooling and review.
      security: []
      responses:
        '200':
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string
  /api/auth/login:
    post:
      summary: Create an authenticated persistent session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      summary: Revoke the current persistent session token.
      parameters:
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/prompts/active:
    get:
      summary: List active Agent prompt versions.
      security: []
      responses:
        '200':
          description: Active prompt version list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromptVersionResponse'
  /api/projects:
    get:
      summary: List projects visible to the session user.
      parameters:
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Project history visible to the session user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a project from a natural-language requirement.
      parameters:
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/dashboard:
    get:
      summary: List project dashboard summaries visible to the session user.
      parameters:
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Project dashboard summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectDashboardItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/{projectId}:
    get:
      summary: Fetch a project visible to the session user.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/code-skeleton:
    post:
      summary: Generate and persist a code skeleton export for a project.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Generated code skeleton export payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeGenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Specification or build verification gate rejected the bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/projects/{projectId}/delivery-readiness:
    get:
      summary: Evaluate trusted specification and post-generation build delivery gates.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Current delivery gate state and blockers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryReadinessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/trace-graph:
    get:
      summary: Fetch stable artifact components and explicit trace edges for one workflow run.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - name: workflowRunId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Artifact trace graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactTraceGraphResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/code-generation-jobs:
    get:
      summary: List durable code generation jobs.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Code generation job metadata list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeGenerationJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/code-generation-jobs/{jobId}/cancel:
    post:
      summary: Cancel a running code generation job.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Cancelled code generation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeGenerationJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/projects/{projectId}/code-generation-jobs/{jobId}/retry:
    post:
      summary: Retry a failed code generation job.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Retried code skeleton export payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeGenerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/projects/{projectId}/diagnostics:
    get:
      summary: Summarize project workflow, Agent task, audit, external call, and model telemetry.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Project diagnostics summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDiagnosticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/workflow-approvals:
    get:
      summary: List workflow approvals for a project.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Workflow approval list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflow-approvals/{approvalId}/decide:
    post:
      summary: Decide a pending workflow approval using optimistic concurrency control.
      parameters:
      - $ref: '#/components/parameters/ApprovalId'
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Persisted approval decision or an idempotent replay of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OptimisticLockConflict'
  /api/workflows/{workflowKey}/versions:
    get:
      summary: List immutable workflow definition versions.
      parameters:
      - name: workflowKey
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Workflow version list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowVersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflow-runs:
    post:
      summary: Start a versioned workflow with a frozen execution policy and server-trusted retrieval context.
      parameters:
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunStartRequest'
      responses:
        '200':
          description: Started workflow run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/workflow-runs/{runId}:
    get:
      summary: Fetch a versioned workflow run and its budget consumption.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Workflow run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflow-runs/{runId}/nodes:
    get:
      summary: List all node attempts for a workflow run.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Workflow node attempts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowNodeRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflow-runs/{runId}/metrics:
    get:
      summary: Fetch runtime, model usage, cost, and remaining workflow budgets.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Workflow runtime metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRuntimeMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflow-runs/{runId}/replay:
    post:
      summary: Create an immutable replay from the original or a selected workflow version.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowReplayRequest'
      responses:
        '200':
          description: Replay workflow run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/projects/{projectId}/workflow-runs:
    get:
      summary: List workflow run history for a project.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Workflow run history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/workflow-runs/page:
    get:
      summary: List workflow run history using a stable ascending id cursor.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationCursor'
      responses:
        '200':
          description: Cursor page of workflow runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/workflow-runs/{runId}/cancel:
    post:
      summary: Cancel a running workflow run.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Cancelled workflow run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/workflow-runs/{runId}/nodes/page:
    get:
      summary: List workflow node runs by stable ascending ID cursor.
      description: New rows are returned only after the last ID from the previous page, avoiding offset drift.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationCursor'
      responses:
        '200':
          description: Cursor page of workflow node runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowNodeRunCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/audit-events:
    get:
      summary: List project audit events.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Audit event history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/model-invocations:
    get:
      summary: List model invocation telemetry.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      - name: workflowNodeRunId
        in: query
        required: false
        description: Filter to the physical calls belonging to one workflow node attempt.
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Model invocation telemetry history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInvocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/model-invocations/page:
    get:
      summary: List model invocations by stable ascending ID cursor.
      description: The cursor resumes after the previous page's last invocation ID and is unaffected by later inserts.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationCursor'
      - name: workflowNodeRunId
        in: query
        required: false
        description: Filter to the physical calls belonging to one workflow node attempt.
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Cursor page of model invocation telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInvocationCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/knowledge/sources:
    get:
      summary: List project knowledge sources indexed from artifacts.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Knowledge source list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeSourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/review:
    get:
      summary: Fetch the review score and paged review issues.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Review score and issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/artifacts:
    get:
      summary: List project artifacts.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Artifact list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/review/issues/{issueId}:
    put:
      summary: Start, resolve, reopen, or explicitly ignore a first-class review issue.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewIssueUpdateRequest'
      responses:
        '200':
          description: Updated review issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/artifacts/page:
    get:
      summary: List project artifacts by stable ascending ID cursor.
      description: New rows are returned only after the previous page's last ID, so inserts do not shift existing pages.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationCursor'
      responses:
        '200':
          description: Cursor page of project artifacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/artifacts/{artifactId}:
    put:
      summary: Update an artifact by creating a new draft version.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArtifactRequest'
      responses:
        '200':
          description: Updated artifact draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OptimisticLockConflict'
  /api/projects/{projectId}/artifacts/{artifactId}/versions:
    get:
      summary: List artifact version history.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Artifact version history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/artifacts/{artifactId}/approve:
    post:
      summary: Approve an artifact draft.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Approved artifact status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveArtifactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/projects/{projectId}/artifacts/{artifactId}/diff:
    get:
      summary: Compare two versions of the same artifact and return changed JSON paths.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - name: againstArtifactId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Artifact field diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDiffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/artifacts/{artifactId}/restore:
    post:
      summary: Restore an earlier artifact as a new candidate version without rewriting history.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactRestoreRequest'
      responses:
        '200':
          description: Newly created candidate artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OptimisticLockConflict'
  /api/projects/{projectId}/exports:
    get:
      summary: List durable export files without large content payloads.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Export metadata list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects/{projectId}/exports/{exportFileId}:
    get:
      summary: Fetch a stored export file with content.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExportFileId'
      - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Export file detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/export:
    post:
      summary: Render and persist a Markdown or PDF export.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionToken'
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - MARKDOWN
          - PDF
          default: MARKDOWN
      responses:
        '200':
          description: Generated export payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/health:
    get:
      summary: Check backend application health.
      security: []
      responses:
        '200':
          description: Backend is available.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
  /api/workflows:
    post:
      summary: Create a draft dynamic workflow version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDraftRequest'
      responses:
        '200':
          description: Draft workflow version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workflows/{versionId}/validate:
    post:
      summary: Validate a draft workflow DAG and executable contract.
      parameters:
      - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowValidationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflows/{versionId}/publish:
    post:
      summary: Publish a validated workflow version.
      parameters:
      - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Published workflow version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/workflow-runs/{runId}/dead-letters:
    get:
      summary: List workflow command dead letters.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: DEAD_LETTER
      - $ref: '#/components/parameters/PaginationLimit'
      - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          description: Dead-letter commands.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDeadLetterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflow-runs/{runId}/dead-letters/{outboxId}/replay:
    post:
      summary: Replay a workflow command dead letter.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/OutboxId'
      responses:
        '200':
          description: Updated dead letter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDeadLetterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/workflow-runs/{runId}/dead-letters/{outboxId}/close:
    post:
      summary: Close a workflow command dead letter without replay.
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/OutboxId'
      responses:
        '200':
          description: Updated dead letter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDeadLetterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: cookie
      name: AUTOSPEC_SESSION
  parameters:
    SessionToken:
      name: AUTOSPEC_SESSION
      in: cookie
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ExportFileId:
      name: exportFileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PaginationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PaginationOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PaginationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page; ordering is ascending by id.
      schema:
        type: string
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OutboxId:
      name: outboxId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Login attempt rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Session user lacks the required project role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Project-scoped resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Operation conflicts with current durable workflow state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    OptimisticLockConflict:
      description: The resource changed after the client loaded it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            code: OPTIMISTIC_LOCK_CONFLICT
            status: 409
            message: The artifact was modified by another request
            path: /api/projects/1/artifacts/10
            timestamp: '2026-07-31T12:00:00Z'
            fieldErrors: {}
            details:
              resourceType: artifact
              resourceId: '10'
              expectedLockVersion: '0'
              currentLockVersion: '1'
              latestResourceId: '11'
              latestResourceVersion: '2'
    BadGateway:
      description: External Agent Engine failed or returned invalid output.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
      - userId
      - username
      - displayName
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    CreateProjectRequest:
      type: object
      required:
      - name
      - requirement
      properties:
        name:
          type: string
          minLength: 1
        requirement:
          type: string
          minLength: 1
    CreateProjectResponse:
      type: object
      required:
      - projectId
      - status
      properties:
        projectId:
          type: integer
          format: int64
        status:
          type: string
    ProjectResponse:
      type: object
      required:
      - projectId
      - name
      - originalRequirement
      - status
      - createdAt
      - updatedAt
      properties:
        projectId:
          type: integer
          format: int64
        name:
          type: string
        originalRequirement:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowApprovalResponse:
      type: object
      required:
      - id
      - workflowRunId
      - nodeRunId
      - mode
      - allowedActions
      - status
      - lockVersion
      properties:
        id:
          type: integer
          format: int64
        workflowRunId:
          type: integer
          format: int64
        nodeRunId:
          type: integer
          format: int64
        nodeId:
          type: string
          nullable: true
        mode:
          type: string
          enum:
          - BEFORE_NODE
          - AFTER_NODE
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - APPROVE
            - REJECT
            - EDIT_AND_APPROVE
            - ROLLBACK_TO_NODE
            - CANCEL_WORKFLOW
        status:
          type: string
        decision:
          type: string
          nullable: true
        candidateArtifactId:
          type: integer
          format: int64
          nullable: true
        revisedArtifactId:
          type: integer
          format: int64
          nullable: true
        lockVersion:
          type: integer
          minimum: 0
        decisionReason:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    ApprovalDecisionRequest:
      type: object
      required:
      - decision
      - idempotencyKey
      - expectedLockVersion
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          - EDIT_AND_APPROVE
          - ROLLBACK_TO_NODE
          - CANCEL_WORKFLOW
        reason:
          type: string
          nullable: true
        editedContent:
          type: string
          nullable: true
        rollbackNodeId:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          minLength: 1
        expectedLockVersion:
          type: integer
          minimum: 0
    KnowledgeSourceResponse:
      type: object
      required:
      - projectId
      - artifactId
      - artifactType
      - title
      - artifactVersion
      - content
      properties:
        projectId:
          type: integer
          format: int64
        artifactId:
          type: integer
          format: int64
        artifactType:
          type: string
        title:
          type: string
        artifactVersion:
          type: integer
        chunkId:
          type: integer
          format: int64
          nullable: true
        chunkIndex:
          type: integer
          nullable: true
        citationLocation:
          type: string
          nullable: true
        content:
          type: string
        retrievalStrategy:
          type: string
          nullable: true
        chunkerVersion:
          type: string
          nullable: true
        embeddingModel:
          type: string
          nullable: true
        artifactContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
        chunkContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
        relevanceScore:
          type: number
          nullable: true
    PromptVersionResponse:
      type: object
      required:
      - id
      - promptKey
      - version
      - checksum
      - active
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        promptKey:
          type: string
        version:
          type: string
        checksum:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CodeGenerationResponse:
      type: object
      required:
      - format
      - content
      - fileName
      - mediaType
      - encoding
      properties:
        format:
          type: string
        content:
          type: string
        fileName:
          type: string
        mediaType:
          type: string
        encoding:
          type: string
    CodeGenerationJobResponse:
      type: object
      required:
      - id
      - status
      - manifest
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        retryOfJobId:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
        manifest:
          type: string
        gateStatus:
          type: string
          nullable: true
          enum:
          - PASSED
          - BLOCKED
        manifestHash:
          type: string
          nullable: true
        verificationJson:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    DeliveryReadinessResponse:
      type: object
      required:
      - specReady
      - buildReady
      - status
      - blockers
      properties:
        specReady:
          type: boolean
        buildReady:
          type: boolean
        status:
          type: string
          enum:
          - NOT_STARTED
          - SPEC_BLOCKED
          - BUILD_REQUIRED
          - READY
        workflowRunId:
          type: integer
          format: int64
          nullable: true
        codeGenerationJobId:
          type: integer
          format: int64
          nullable: true
        blockers:
          type: array
          items:
            type: string
    ArtifactTraceGraphResponse:
      type: object
      required:
      - components
      - edges
      properties:
        workflowRunId:
          type: integer
          format: int64
          nullable: true
        components:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactTraceComponent'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactTraceEdge'
    ArtifactTraceComponent:
      type: object
      required:
      - artifactId
      - artifactType
      - componentKey
      - componentType
      - displayName
      - jsonPath
      - contentHash
      properties:
        artifactId:
          type: integer
          format: int64
        artifactType:
          type: string
        componentKey:
          type: string
        componentType:
          type: string
        displayName:
          type: string
        jsonPath:
          type: string
        contentHash:
          type: string
    ArtifactTraceEdge:
      type: object
      required:
      - sourceArtifactId
      - fromComponentKey
      - toComponentKey
      - relationType
      properties:
        sourceArtifactId:
          type: integer
          format: int64
        fromComponentKey:
          type: string
        toComponentKey:
          type: string
        relationType:
          type: string
    WorkflowVersionResponse:
      type: object
      required:
      - id
      - definitionId
      - workflowKey
      - version
      - specJson
      - contentHash
      - status
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        definitionId:
          type: integer
          format: int64
        workflowKey:
          type: string
        version:
          type: string
        specJson:
          type: string
        contentHash:
          type: string
        status:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    WorkflowExecutionPolicyRequest:
      type: object
      properties:
        qualityProfile:
          type: string
          enum:
          - FAST
          - BALANCED
          - DEEP
        maxTokens:
          type: integer
          format: int64
          minimum: 1
        maxCost:
          type: number
          minimum: 0
          exclusiveMinimum: true
        maxModelCalls:
          type: integer
          minimum: 1
        maxWallTimeMs:
          type: integer
          format: int64
          minimum: 1000
    WorkflowRunStartRequest:
      type: object
      required:
      - projectId
      - workflowVersionId
      - input
      properties:
        projectId:
          type: integer
          format: int64
        workflowVersionId:
          type: integer
          format: int64
        input:
          type: object
          description: Client requirement input. Retrieved sources are ignored and injected by the server from actor-accessible
            approved artifacts.
          additionalProperties: true
        idempotencyKey:
          type: string
          maxLength: 128
          nullable: true
        executionPolicy:
          $ref: '#/components/schemas/WorkflowExecutionPolicyRequest'
    WorkflowReplayRequest:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - ORIGINAL_SNAPSHOT
          - SELECTED_VERSION
        selectedWorkflowVersionId:
          type: integer
          format: int64
          nullable: true
        idempotencyKey:
          type: string
          maxLength: 128
          nullable: true
    WorkflowRunResponse:
      type: object
      required:
      - id
      - projectId
      - operation
      - qualityProfile
      - consumedTokens
      - consumedCost
      - modelCallCount
      - reservedTokens
      - reservedCost
      - reservedModelCalls
      - status
      - startedAt
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        operation:
          type: string
        idempotencyKey:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        workflowVersionId:
          type: integer
          format: int64
          nullable: true
        replayOfRunId:
          type: integer
          format: int64
          nullable: true
        reviewRound:
          type: integer
          nullable: true
        maxReviewRounds:
          type: integer
          nullable: true
        qualityProfile:
          type: string
          enum:
          - FAST
          - BALANCED
          - DEEP
        maxTokens:
          type: integer
          format: int64
          nullable: true
        maxCost:
          type: number
          nullable: true
        maxModelCalls:
          type: integer
          nullable: true
        maxWallTimeMs:
          type: integer
          format: int64
          nullable: true
        consumedTokens:
          type: integer
          format: int64
        consumedCost:
          type: number
        modelCallCount:
          type: integer
        reservedTokens:
          type: integer
          format: int64
        reservedCost:
          type: number
        reservedModelCalls:
          type: integer
        status:
          type: string
        responseStatus:
          type: string
          nullable: true
        responsePercent:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    ModelUsageResponse:
      type: object
      required:
      - providerKey
      - modelName
      - invocationCount
      - modelCallCount
      - inputTokens
      - outputTokens
      - cacheTokens
      - estimatedCost
