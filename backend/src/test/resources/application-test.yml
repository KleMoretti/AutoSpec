spring:
  datasource:
    url: jdbc:h2:mem:autospec;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

autospec:
  auth:
    demo-user:
      enabled: true
      username: owner
      display-name: Owner
      password: owner-pass
    login-rate-limit:
      enabled: false
    session:
      expose-token-in-response: true
  workflow:
    admission:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
