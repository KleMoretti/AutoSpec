name: Full-stack quality gate

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and application tests
        run: mvn --batch-mode test
      - name: Testcontainers integration tests
        run: mvn --batch-mode -Pintegration-test verify

  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-engine/requirements.txt
      - run: python -m pip install --requirement agent-engine/requirements.txt
      - name: Agent schemas, workflows, runtime, and quality gates
        working-directory: agent-engine
        run: python -m pytest -q
      - name: Verify canonical V5 contract
        run: python scripts/verify_workflow_contract.py

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Component and API client tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  compose-and-images:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-autospec-password
      MYSQL_ROOT_PASSWORD: ci-autospec-root-password
      REDIS_PASSWORD: ci-autospec-redis-password
      AGENT_ENGINE_SERVICE_TOKEN: ci-autospec-service-token
      SPEC_VERIFIER_SERVICE_TOKEN: ci-autospec-verifier-token
      VERIFY_MYSQL_PASSWORD: ci-autospec-verifier-mysql-password
      VERIFY_MYSQL_ROOT_PASSWORD: ci-autospec-verifier-mysql-root-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate default Compose graph
        run: docker compose config --quiet
      - name: Validate monitoring Compose graph
        run: docker compose --profile monitoring config --quiet
      - name: Validate verification Compose graph
        run: docker compose --profile verification config --quiet
      - name: Build backend image
        run: docker build backend
      - name: Build Agent image
        run: docker build agent-engine
      - name: Build spec verifier image
        run: docker build --file agent-engine/spec_verifier/Dockerfile agent-engine
      - name: Build frontend image
        run: docker build frontend

  verifier-sandbox-probes:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-autospec-password
      MYSQL_ROOT_PASSWORD: ci-autospec-root-password
      REDIS_PASSWORD: ci-autospec-redis-password
      AGENT_ENGINE_SERVICE_TOKEN: ci-autospec-service-token
      SPEC_VERIFIER_SERVICE_TOKEN: ci-autospec-verifier-token
      VERIFY_MYSQL_PASSWORD: ci-autospec-verifier-mysql-password
      VERIFY_MYSQL_ROOT_PASSWORD: ci-autospec-verifier-mysql-root-password
      VERIFIER_COMPOSE_PROJECT: autospec-verifier-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start isolated verifier
        run: docker compose -p "$VERIFIER_COMPOSE_PROJECT" up --build -d spec-verifier
      - name: Run verifier sandbox probes
        run: python scripts/verify_spec_sandbox.py --project "$VERIFIER_COMPOSE_PROJECT"
      - name: Stop isolated verifier
        if: always()
        run: docker compose -p "$VERIFIER_COMPOSE_PROJECT" down --remove-orphans
